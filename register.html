<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#090a12" />
        <title>Register | CityRide</title>
        <link rel="icon" href="bus-logo.png" type="image/png" />
        <link rel="stylesheet" href="css/style.css" />
        <script src="js/js/ui.js" defer></script>
    </head>
    <body>
        <a href="#main-content" class="skip-link btn btn-primary">Skip to content</a>
        <header class="navbar">
            <a href="index.html" class="logo"><span class="brand-mark" aria-hidden="true"></span>CityRide</a>
            <nav class="nav-links" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
            </nav>
            <div class="nav-buttons"><a href="login.html" class="btn btn-outline">Sign in</a></div>
        </header>

        <main id="main-content" class="form-section">
            <div class="form-intro">
                <h1>Get started with CityRide.</h1>
                <p>Create an account to apply for a student or general bus pass.</p>
                <figure class="hero-image">
                    <img
                        src="assets/cityride-night-bus.webp"
                        width="1120"
                        height="1400"
                        alt="Violet city bus on a rain-lit street"
                        loading="lazy"
                    />
                </figure>
            </div>
            <div class="form-card">
                <h2>Create your account</h2>
                <form id="registerForm">
                    <div class="field">
                        <label for="name">Full name</label>
                        <input
                            id="name"
                            type="text"
                            autocomplete="name"
                            placeholder="Enter your full name"
                            required
                        />
                    </div>
                    <div class="field">
                        <label for="email">Email address</label>
                        <input
                            id="email"
                            type="email"
                            autocomplete="email"
                            placeholder="you@example.com"
                            required
                        />
                    </div>
                    <div class="field">
                        <label for="phone">Mobile number</label>
                        <input
                            id="phone"
                            type="tel"
                            autocomplete="tel-national"
                            inputmode="numeric"
                            placeholder="10-digit mobile number"
                            pattern="[6-9][0-9]{9}"
                            maxlength="10"
                            required
                        />
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input
                            id="password"
                            type="password"
                            autocomplete="new-password"
                            placeholder="At least 6 characters"
                            minlength="6"
                            required
                        />
                    </div>
                    <div class="field">
                        <label for="confirmPassword">Confirm password</label>
                        <input
                            id="confirmPassword"
                            type="password"
                            autocomplete="new-password"
                            placeholder="Re-enter your password"
                            required
                        />
                    </div>
                    <div class="field">
                        <label for="category">Passenger category</label>
                        <select id="category" required>
                            <option value="">Select category</option>
                            <option value="Student">Student</option>
                            <option value="General">General public</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary form-btn">
                        Create account <span aria-hidden="true">→</span>
                    </button>
                </form>
                <p id="registerMessage" class="message" role="status"></p>
                <p class="form-footer">Already have an account? <a href="login.html">Sign in</a></p>
            </div>
        </main>
        <script src="js/js/auth.js"></script>
    </body>
</html>
